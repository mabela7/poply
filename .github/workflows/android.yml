name: Build Poply Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Add Firebase Google Services file
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - name: Configure Google Services plugin
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          sed -i "/plugins {/a\\    id 'com.google.gms.google-services' version '4.4.3'" android/app/build.gradle
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Poply-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
